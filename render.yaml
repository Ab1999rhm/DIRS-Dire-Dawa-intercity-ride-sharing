services:
  - type: web
    name: dirs-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: FRONTEND_URL
        sync: false
      - key: PASSENGER_APP_URL
        sync: false
      - key: DRIVER_APP_URL
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: BACKEND_URL
        sync: false
