services:
  # ── Backend API + WebSocket Server ────────────────────────────────────────
  - type: web
    name: dirs-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    nodeVersion: 20
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Set manually in Render Dashboard
      - key: JWT_SECRET
        sync: false          # Set manually in Render Dashboard
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: FRONTEND_URL
        sync: false          # e.g. https://dirs-web-app.vercel.app
      - key: PASSENGER_APP_URL
        sync: false
      - key: DRIVER_APP_URL
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "10"
      - key: KEEP_ALIVE_URLS
        sync: false          # https://dirs-backend.onrender.com/api/health,https://dirs-web-app.vercel.app/
      - key: SMTP_HOST
        sync: false          # e.g. smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false          # Brevo SMTP username
      - key: SMTP_PASS
        sync: false          # Brevo SMTP key
      - key: SMTP_SECURE
        value: "false"
      - key: EMAIL_FROM
        sync: false          # e.g. "Nexa" <sender@example.com>

  # ── Frontend Static Site (optional — can also deploy to Vercel) ───────────
  - type: web
    name: dirs-web-app
    runtime: static
    region: oregon
    plan: free
    rootDir: web-app
    buildCommand: npm install && npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: REACT_APP_API_URL
        sync: false          # e.g. https://dirs-backend.onrender.com/api
      - key: REACT_APP_NAME
        value: DIRS Ride Sharing
