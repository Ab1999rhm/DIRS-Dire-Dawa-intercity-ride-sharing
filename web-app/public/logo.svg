<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Car Icon Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#grad1)"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Car Body -->
  <g transform="translate(18, 30)">
    <path d="M8 20 Q8 12 16 10 L24 6 Q30 4 36 4 L52 4 Q58 4 62 8 L68 14 Q70 17 70 22 L70 30 Q70 34 66 34 L12 34 Q8 34 8 30 Z" fill="white"/>
    <!-- Windows -->
    <path d="M18 12 L26 7 Q30 5 36 5 L50 5 Q54 5 58 8 L62 12 Z" fill="rgba(37,99,235,0.3)"/>
    <rect x="18" y="12" width="48" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
    <!-- Wheels -->
    <circle cx="22" cy="34" r="6" fill="#1e293b"/>
    <circle cx="22" cy="34" r="3" fill="#64748b"/>
    <circle cx="56" cy="34" r="6" fill="#1e293b"/>
    <circle cx="56" cy="34" r="3" fill="#64748b"/>
    <!-- Headlights -->
    <rect x="66" y="16" width="4" height="6" rx="2" fill="#fbbf24"/>
    <rect x="4" y="16" width="3" height="5" rx="1.5" fill="#ef4444" opacity="0.8"/>
  </g>
  
  <!-- DIRS Text -->
  <text x="115" y="48" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#0f172a" letter-spacing="1">DIRS</text>
  
  <!-- Divider Line -->
  <rect x="115" y="56" width="180" height="2" rx="1" fill="url(#grad2)"/>
  
  <!-- Subtitle -->
  <text x="115" y="76" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">Dire Dawa Intercity &amp; Ride Sharing</text>
</svg>