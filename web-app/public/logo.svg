<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="car" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="160" rx="20" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Decorative circles -->
  <circle cx="720" cy="30" r="60" fill="rgba(255,255,255,0.05)"/>
  <circle cx="750" cy="140" r="40" fill="rgba(255,255,255,0.05)"/>
  <circle cx="80" cy="130" r="35" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Road line -->
  <line x1="40" y1="135" x2="760" y2="135" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="12,8"/>
  
  <!-- Car body -->
  <g transform="translate(50, 35)">
    <!-- Car body -->
    <path d="M30 50 Q30 35 45 30 L70 20 Q85 15 100 15 L140 15 Q155 15 165 25 L180 40 Q185 45 185 55 L185 65 Q185 75 175 75 L40 75 Q30 75 30 65 Z" fill="url(#car)"/>
    
    <!-- Windows -->
    <path d="M50 32 L72 22 Q82 18 95 18 L130 18 Q140 18 148 25 L155 32 Z" fill="rgba(37,99,235,0.3)"/>
    <path d="M55 32 L55 55 L150 55 L150 32 Q145 22 130 20 L95 20 Q82 20 72 25 Z" fill="rgba(37,99,235,0.2)"/>
    
    <!-- Wheels -->
    <circle cx="70" cy="75" r="16" fill="#1e293b"/>
    <circle cx="70" cy="75" r="10" fill="#475569"/>
    <circle cx="70" cy="75" r="4" fill="#94a3b8"/>
    
    <circle cx="155" cy="75" r="16" fill="#1e293b"/>
    <circle cx="155" cy="75" r="10" fill="#475569"/>
    <circle cx="155" cy="75" r="4" fill="#94a3b8"/>
    
    <!-- Headlights -->
    <ellipse cx="183" cy="50" rx="5" ry="8" fill="#fbbf24" opacity="0.9"/>
    <ellipse cx="32" cy="50" rx="4" ry="6" fill="#ef4444" opacity="0.8"/>
    
    <!-- Location pin on car -->
    <g transform="translate(108, -15)">
      <path d="M12 0 C6 0 0 5 0 12 C0 22 12 35 12 35 C12 35 24 22 24 12 C24 5 18 0 12 0 Z" fill="#ffffff" opacity="0.9"/>
      <circle cx="12" cy="12" r="5" fill="#2563eb"/>
    </g>
  </g>
  
  <!-- DIRS Text -->
  <text x="260" y="85" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="3">DIRS</text>
  
  <!-- Subtitle line -->
  <line x1="260" y1="100" x2="520" y2="100" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  
  <!-- Subtitle -->
  <text x="260" y="125" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.9)" letter-spacing="1">Dire Dawa Intercity &amp; Ride Sharing</text>
  
  <!-- Tagline -->
  <text x="260" y="148" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.6)" letter-spacing="2">SAFE  ·  FAST  ·  RELIABLE</text>
</svg>