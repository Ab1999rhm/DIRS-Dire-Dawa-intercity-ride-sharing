<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DIRS" />
    <meta name="description" content="DIRS - Dire Dawa's Intercity and Ride Sharing System. Book rides, track drivers, travel safely." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="DIRS" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-TileImage" content="/logo-full.png" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="format-detection" content="telephone=yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="stylesheet" href="/leaflet.css" />
    <link rel="manifest" href="/manifest.json" />
    <title>DIRS - Dire Dawa Ride Sharing</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
      .loading-screen { display: flex; align-items: center; justify-content: center; height: 100vh; background: #f8fafc; }
      .loading-spinner { width: 40px; height: 40px; border: 4px solid #dbeafe; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .error-screen { display: none; align-items: center; justify-content: center; height: 100vh; background: #f8fafc; padding: 20px; }
      .error-content { text-align: center; max-width: 400px; }
      .error-content h2 { color: #ef4444; margin-bottom: 10px; }
      .error-content p { color: #64748b; margin-bottom: 20px; }
      .error-content button { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    </style>
  </head>
  <body>
    <noscript>
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #f8fafc; padding: 20px; text-align: center;">
        <div>
          <h2 style="color: #ef4444; margin-bottom: 10px;">JavaScript Required</h2>
          <p style="color: #64748b;">Please enable JavaScript in your browser settings to use this app.</p>
        </div>
      </div>
    </noscript>
    <div id="root">
      <div class="loading-screen"><div class="loading-spinner"></div></div>
    </div>
    <div id="error-root" class="error-screen">
      <div class="error-content">
        <h2>App Failed to Load</h2>
        <p>The app is taking too long to load. Please check your internet connection and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
      </div>
    </div>
    <script>
      // Timeout fallback for slow JavaScript loading
      var loadTimeout = setTimeout(function() {
        var root = document.getElementById('root');
        var errorRoot = document.getElementById('error-root');
        if (root && errorRoot && !window.React) {
          root.style.display = 'none';
          errorRoot.style.display = 'flex';
        }
      }, 15000);

      // Clear timeout when app loads
      window.addEventListener('load', function() {
        clearTimeout(loadTimeout);
      });

      // Service Worker registration with error handling
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          if (!isLocalhost) {
            navigator.serviceWorker.register('/sw.js')
              .then(function(reg) {
                console.log('SW registered:', reg.scope);
                reg.addEventListener('updatefound', function() {
                  var newWorker = reg.installing;
                  if (newWorker) {
                    newWorker.addEventListener('statechange', function() {
                      if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                        window.location.reload();
                      }
                    });
                  }
                });
              })
              .catch(function(err) { console.log('SW failed:', err); });
          } else {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
        });
      }
    </script>
  </body>
</html>
